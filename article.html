<style>

mplate-columns:repeat(2,1fr);gap:12px}.related a{padding:14px;background:#fff;border:1px solid var(--line);border-radius:8px;font-weight:600}.status{font-size:13px;color:#1b7048}@media(max-width:600px){.article{padding:18px}.body{font-size:18px}.related{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap"><a class="brand" href="/">নবীগঞ্জ ভিউ<small>NABIGANJ VIEW</small></a><a class="back" href="/">← প্রচ্ছদে ফিরে যান</a></div></header><main class="wrap"><div class="crumb"><a href="/">প্রচ্ছদ</a> / সংবাদ</div><article class="article" id="article"><p class="muted">সংবাদ লোড হচ্ছে…</p></article><div class="share"><button id="fb">Facebook শেয়ার</button><button id="wa">WhatsApp শেয়ার</button><button id="copy">লিংক কপি</button></div><section class="panel"><h2>মন্তব্য লিখুন</h2><form id="commentForm"><label>আপনার নাম</label><input id="commentName" maxlength="80" required><label>ইমেইল (ঐচ্ছিক)</label><input id="commentEmail" type="email" maxlength="254"><label>মন্তব্য</label><textarea id="commentBody" maxlength="2000" required></textarea><button class="btn">মন্তব্য জমা দিন</button><p id="commentMsg" class="status"></p></form></section><section class="panel"><h2>পাঠকের মন্তব্য</h2><div id="comments" class="muted">মন্তব্য লোড হচ্ছে…</div></section><section class="panel"><h2>আরও সংবাদ</h2><div id="related" class="related"></div></section></main>
<script>
const db=supabase.createClient('https://nywlrdazdcybidlmfnmj.supabase.co','sb_publishable_tRHM7STxg015LYXM0eyvOw_qrApPqIq'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id'),slug=new URLSearchParams(location.search).get('slug');let article;
async function init(){if(!id&&!slug){$('article').textContent='সংবাদটি পাওয়া যায়নি।';return}let q=db.from('articles').select('id,slug,title,title_bn,title_en,summary_bn,summary_en,body_html,body_text,original_url,image_url,image_rights,image_caption,image_credit,reporter_name,published_at,updated_at,category_id,location_id').eq(id?'id':'slug',id||slug).eq('status','published').maybeSingle();const r=await q;if(r.error||!r.data){$('article').textContent='এই সংবাদটি পাওয়া যায়নি অথবা প্রকাশিত নয়।';return}article=r.data;render();addSchema();await loadComments();await loadRelated();db.from('page_views').insert({article_id:article.id,path:location.pathname+location.search}).then(()=>{});}
function addSchema(){if(!article)return;const x={"@context":"https://schema.org","@type":"NewsArticle",headline:article.title_bn||article.title_en,datePublished:article.published_at,dateModified:article.updated_at||article.published_at,author:{"@type":"Organization",name:article.reporter_name||"নবীগঞ্জ ভিউ"},publisher:{"@type":"Organization",name:"নবীগঞ্জ ভিউ"},mainEntityOfPage:location.href,description:article.summary_bn||article.summary_en||""};if(article.image_url&&["licensed","public_domain","permission_granted"].includes(article.image_rights))x.image=[article.image_url];const s=document.createElement("script");s.type="application/ld+json";s.textContent=JSON.stringify(x);document.head.appendChild(s)}
function render(){const title=article.title_bn||article.title||article.title_en;document.title=title+' | নবীগঞ্জ ভিউ';document.querySelector('meta[name="description"]').content=article.summary_bn||article.summary_en||title;document.querySelector('meta[property="og:title"]').content=title;document.querySelector('meta[property="og:description"]').content=article.summary_bn||article.summary_en||title;document.querySelector('meta[property="og:url"]').content=location.href;const sourceBody=article.body_html||('<p>'+esc(article.body_text||article.summary_bn||article.summary_en||'')+'</p>');const safeBody=window.DOMPurify?window.DOMPurify.sanitize(sourceBody,{USE_PROFILES:{html:true},FORBID_TAGS:['script','style','iframe','object','embed','form'],FORBID_ATTR:['onerror','onclick','onload']}):('<p>'+esc(article.body_text||article.summary_bn||article.summary_en||'')+'</p>');$('article').innerHTML='<span class="category">নবীগঞ্জ ভিউ</span><h1>'+esc(title)+'</h1>'+(article.summary_bn?'<div class="sub">'+esc(article.summary_bn)+'</div>':'')+'<div class="meta">'+esc(article.reporter_name||'নবীগঞ্জ ভিউ ডেস্ক')+' · '+esc(article.published_at?new Date(article.published_at).toLocaleString('bn-BD'):'')+(article.updated_at&&article.updated_at!==article.published_at?' · হালনাগাদ: '+esc(new Date(article.updated_at).toLocaleString('bn-BD')):'')+'</div>'+(article.image_url&&['licensed','public_domain','permission_granted'].includes(article.image_rights)?'<img class="cover" src="'+esc(article.image_url)+'" alt="'+esc(title)+'">'+(article.image_caption||article.image_credit?'<div class="caption">'+esc(article.image_caption||'')+' '+esc(article.image_credit||'')+'</div>':''):'')+'<div class="body">'+safeBody+'</div>'+(article.original_url?'<div class="source">মূল সূত্র: <a href="'+esc(article.original_url)+'" target="_blank" rel="noopener noreferrer">প্রকাশকের মূল প্রতিবেদন ↗</a></div>':'');}
async function loadComments(){const r=await db.from('comments').select('id,display_name,body,created_at').eq('article_id',article.id).eq('status','approved').order('created_at',{ascending:false}).limit(100);$('comments').innerHTML=r.error? 'মন্তব্য লোড করা যায়নি':(r.data||[]).map(x=>'<div class="comment"><b>'+esc(x.display_name)+'</b><p>'+esc(x.body)+'</p><small class="muted">'+esc(new Date(x.created_at).toLocaleString('bn-BD'))+'</small> · <button onclick="reportComment(\''+x.id+'\')" style="border:0;background:none;color:#b52b35;cursor:pointer">রিপোর্ট</button></div>').join('')||'এখনো কোনো অনুমোদিত মন্তব্য নেই।'}
window.reportComment=async cid=>{const reason=prompt('কেন মন্তব্যটি রিপোর্ট করছেন?');if(!reason)return;const r=await db.from('comment_reports').insert({comment_id:cid,reason:reason.slice(0,500)});alert(r.error?'রিপোর্ট জমা হয়নি।':'রিপোর্ট জমা হয়েছে। ধন্যবাদ।')};
$('commentForm').onsubmit=async e=>{e.preventDefault();if(!article)return;const payload={article_id:article.id,display_name:$('commentName').value.trim(),email:$('commentEmail').value.trim()||null,body:$('commentBody').value.trim(),status:'pending'};const r=await db.from('comments').insert(payload);$('commentMsg').textContent=r.error?'মন্তব্য জমা দেওয়া যায়নি: '+r.error.message:'মন্তব্য জমা হয়েছে। প্রকাশের আগে মডারেটর পর্যালোচনা করবেন।';if(!r.error)$('commentForm').reset()};
async function loadRelated(){const q=db.from('articles').select('id,title_bn,title_en').eq('status','published').neq('id',article.id).order('published_at',{ascending:false}).limit(6);if(article.category_id)q.eq('category_id',article.category_id);const r=await q;$('related').innerHTML=(r.data||[]).map(n=>'<a href="article.html?id='+encodeURIComponent(n.id)+'">'+esc(n.title_bn||n.title_en)+'</a>').join('')||'আরও সংবাদ শীঘ্রই';}
$('fb').onclick=()=>window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','noopener');$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(document.title+' '+location.href),'_blank','noopener');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='কপি হয়েছে'}catch{$('copy').textContent='কপি করা যায়নি'}};
init();
</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | নবীগঞ্জ ভিউ</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f6f2;font-family:'Hind Siliguri',sans-serif;color:#17231e}.wrap{max-width:1000px;margin:auto;padding:20px}header{background:#0b3027;color:white;padding:16px}.panel{background:white;border:1px solid #e1e8e0;border-radius:14px;padding:20px;margin:20px 0}input,button{font:inherit;padding:11px;border-radius:8px}input{display:block;width:100%;box-sizing:border-box;border:1px solid #dce5dc;margin:8px 0 14px}button{border:0;background:#d8f36d;color:#153b2d;font-weight:bold;cursor:pointer}.item{border-top:1px solid #e7ece6;padding:14px 0}.danger{background:#fbe5e2;color:#982d27}.muted{color:#718078}</style></head><body><header><div class="wrap">নবীগঞ্জ ভিউ — Admin Panel</div></header><main class="wrap"><section class="panel" id="login"><h2>Admin Login</h2><p class="muted">অনুমোদিত newsroom admin-এর জন্য।</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Login</button></form><p id="msg"></p></section><section class="panel" id="dash" hidden><button id="logout">Logout</button><h2>নিউজ ম্যানেজমেন্ট</h2><p class="muted">Pending নিউজ প্রকাশ বা বাতিল করুন।</p><div id="list">লোড হচ্ছে…</div></section></main><script>const db=supabase.createClient('https://nywlrdazdcybidlmfnmj.supabase.co','sb_publishable_tRHM7STxg015LYXM0eyvOw_qrApPqIq'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user;async function check(){let {data:{session}}=await db.auth.getSession();if(!session){$('login').hidden=false;$('dash').hidden=true;return}let r=await db.auth.getUser();user=r.data.user;if(user?.app_metadata?.role!=='admin'){await db.auth.signOut();$('msg').textContent='এই অ্যাকাউন্টে admin role নেই। Supabase Auth app_metadata.role = admin সেট করতে হবে।';return}$('login').hidden=true;$('dash').hidden=false;load()}$('form').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('msg').textContent=error?.message||'';if(!error)check()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};async function load(){let {data,error}=await db.from('articles').select('id,title_bn,title_en,summary_bn,status,original_url,viral_score').order('collected_at',{ascending:false}).limit(100);if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map(n=>'<div class="item"><b>'+esc(n.title_bn||n.title_en)+'</b><p class="muted">'+esc(n.summary_bn||'AI সারাংশ অপেক্ষমাণ')+'</p><p>Status: '+esc(n.status)+' · Viral score: '+Number(n.viral_score||0).toFixed(1)+'</p><a target="_blank" href="'+esc(n.original_url||'#')+'">মূল সূত্র ↗</a>'+(n.status==='pending'?' <button onclick="setStatus(\''+n.id+'\',\'published\')">প্রকাশ</button> <button class="danger" onclick="setStatus(\''+n.id+'\',\'rejected\')">বাতিল</button>':'')+'</div>').join('')||'কোনো নিউজ নেই'}async function setStatus(id,status){let {error}=await db.from('articles').update({status,published_at:status==='published'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}check();</script></body></html>
